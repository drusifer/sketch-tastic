# One row is one original post. No model or derived image rows.
# For each container, presence/any/multiple bits distinguish:
# absent=FFF, present with zero image members=TFF, one=TTF, multiple=TTT.
# IS_PRESENT checks member existence, not JSON Schema validity (null is present).
version: 0
fields:
  - {key: embed_type, path: "$.embed['$type']"}
  - {key: media_type, path: "$.embed.media['$type']"}
  - {key: reply, path: $.reply, modifier: IS_PRESENT}

  - {key: images_present, path: $.embed.images, modifier: IS_PRESENT}
  - key: images_any
    path: "$[?@ == $.embed && @['$type'] == 'app.bsky.embed.images' && count(@.images[*].image) >= 1]"
    modifier: IS_PRESENT
  - key: images_multiple
    path: "$[?@ == $.embed && @['$type'] == 'app.bsky.embed.images' && count(@.images[*].image) >= 2]"
    modifier: IS_PRESENT

  - {key: gallery_present, path: $.embed.items, modifier: IS_PRESENT}
  - key: gallery_any
    path: "$[?@ == $.embed && @['$type'] == 'app.bsky.embed.gallery' && count(@.items[?@['$type'] == 'app.bsky.embed.gallery#image'].image) >= 1]"
    modifier: IS_PRESENT
  - key: gallery_multiple
    path: "$[?@ == $.embed && @['$type'] == 'app.bsky.embed.gallery' && count(@.items[?@['$type'] == 'app.bsky.embed.gallery#image'].image) >= 2]"
    modifier: IS_PRESENT

  - {key: media_images_present, path: $.embed.media.images, modifier: IS_PRESENT}
  - key: media_images_any
    path: "$.embed[?@ == $.embed.media && $.embed['$type'] == 'app.bsky.embed.recordWithMedia' && @['$type'] == 'app.bsky.embed.images' && count(@.images[*].image) >= 1]"
    modifier: IS_PRESENT
  - key: media_images_multiple
    path: "$.embed[?@ == $.embed.media && $.embed['$type'] == 'app.bsky.embed.recordWithMedia' && @['$type'] == 'app.bsky.embed.images' && count(@.images[*].image) >= 2]"
    modifier: IS_PRESENT

  - {key: media_gallery_present, path: $.embed.media.items, modifier: IS_PRESENT}
  - key: media_gallery_any
    path: "$.embed[?@ == $.embed.media && $.embed['$type'] == 'app.bsky.embed.recordWithMedia' && @['$type'] == 'app.bsky.embed.gallery' && count(@.items[?@['$type'] == 'app.bsky.embed.gallery#image'].image) >= 1]"
    modifier: IS_PRESENT
  - key: media_gallery_multiple
    path: "$.embed[?@ == $.embed.media && $.embed['$type'] == 'app.bsky.embed.recordWithMedia' && @['$type'] == 'app.bsky.embed.gallery' && count(@.items[?@['$type'] == 'app.bsky.embed.gallery#image'].image) >= 2]"
    modifier: IS_PRESENT

  - {key: facet_types, path: "$.facets[*].features[*]['$type']"}
  - {key: languages, path: "$.langs[*]"}
  - {key: labels, path: "$.labels.values[*].val"}

# Summaries across observations in each skit; these never affect kind identity.
aggregates:
  - key: images_count
    path: "$[?@ == $.embed && @['$type'] == 'app.bsky.embed.images'].images[*].image"
    fn: COUNT
  - key: images_bytes
    path: "$[?@ == $.embed && @['$type'] == 'app.bsky.embed.images'].images[*].image.size"
    fn: [SUM, MIN, MAX, AVG]
  - key: gallery_count
    path: "$[?@ == $.embed && @['$type'] == 'app.bsky.embed.gallery'].items[?@['$type'] == 'app.bsky.embed.gallery#image'].image"
    fn: COUNT
  - key: gallery_bytes
    path: "$[?@ == $.embed && @['$type'] == 'app.bsky.embed.gallery'].items[?@['$type'] == 'app.bsky.embed.gallery#image'].image.size"
    fn: [SUM, MIN, MAX, AVG]
  - key: media_images_count
    path: "$.embed[?@ == $.embed.media && $.embed['$type'] == 'app.bsky.embed.recordWithMedia' && @['$type'] == 'app.bsky.embed.images'].images[*].image"
    fn: COUNT
  - key: media_images_bytes
    path: "$.embed[?@ == $.embed.media && $.embed['$type'] == 'app.bsky.embed.recordWithMedia' && @['$type'] == 'app.bsky.embed.images'].images[*].image.size"
    fn: [SUM, MIN, MAX, AVG]
  - key: media_gallery_count
    path: "$.embed[?@ == $.embed.media && $.embed['$type'] == 'app.bsky.embed.recordWithMedia' && @['$type'] == 'app.bsky.embed.gallery'].items[?@['$type'] == 'app.bsky.embed.gallery#image'].image"
    fn: COUNT
  - key: media_gallery_bytes
    path: "$.embed[?@ == $.embed.media && $.embed['$type'] == 'app.bsky.embed.recordWithMedia' && @['$type'] == 'app.bsky.embed.gallery'].items[?@['$type'] == 'app.bsky.embed.gallery#image'].image.size"
    fn: [SUM, MIN, MAX, AVG]
  - {key: text_bytes, path: $.text, op: SIZE, fn: [SUM, MIN, MAX, AVG]}
  - {key: facet_features, path: "$.facets[*].features[*]", fn: COUNT}
  - {key: posted_at, path: $.createdAt, type: DATETIME, fn: [MIN, MAX]}
