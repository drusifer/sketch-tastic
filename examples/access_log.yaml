# yaml-language-server: $schema=../src/fingerprint_sampler/profile.schema.json
# Fingerprint profile for JSON web access logs — nothing eBPF about it.
# Try it (from packages/fingerprint-sampler):
#   fingerprint merge -p examples/access_log.yaml -s /tmp/access.fingerprints.yaml examples/access_log.jsonl
version: 0

fields:
  - key: method
    path: "$.request.method"
  - key: route
    path: "$.request.route"
  - key: status_class
    path: "$.response.status"
    modifier: {name: IN_RANGE, low: 200, high: 399}   # TRUE = success/redirect, FALSE = error
  - key: authenticated
    path: "$.user.id"
    modifier: IS_PRESENT
  - key: slow_upstreams
    path: "$.upstreams[?(@.ms > 500)].name"   # filter: only upstream calls slower than 500 ms

aggregates:
  - key: latency_ms
    path: "$.response.ms"
    fn: [MIN, MAX, AVG]
  - key: bytes_out
    path: "$.response.bytes"
    fn: SUM
  - key: recent_paths
    path: "$.request.path"
    fn: {name: LAST, n: 3}
